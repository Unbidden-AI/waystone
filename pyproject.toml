[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waystone"
version = "0.4.38"
description = "A context intelligence layer for LLM workflows"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "memory", "mcp", "llm", "agents", "context", "knowledge-graph"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "croniter>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "litellm>=1.40",
    "tiktoken>=0.7",
    "tomlkit>=0.12",
    "sqlite-vec",
]

[project.urls]
Homepage = "https://unbidden.ai/waystone/"
Repository = "https://github.com/Unbidden-AI/waystone"
Documentation = "https://unbidden.ai/docs/"
"Bug Tracker" = "https://github.com/Unbidden-AI/waystone/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.22", "pyjwt[crypto]>=2.8"]
# sqlite-vec is now a core dependency (lightweight, native, no transitive deps).
# This extra adds the embedding model stack (sentence-transformers → PyTorch),
# which is heavy and stays opt-in.
semantic = ["sentence-transformers"]
monitoring = ["sentry-sdk[fastapi]>=2.0"]
openclaw = ["pyyaml>=6.0"]  # no extra deps beyond core; pyyaml already required
# Team/Enterprise server backend (PostgresGraphStore — multi-writer + pgvector).
# Solo/local stays on SQLite; this powers the self-hosted/cloud Team Server.
team = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2", "pgvector>=0.2"]

[project.scripts]
waystone = "waystone.cli:cli"
waystone-mcp = "waystone.mcp_server:run_server"
waystone-hook-submit = "waystone._hooks.submit:main"
waystone-hook-stop = "waystone._hooks.stop:main"
waystone-hook-summarize = "waystone._hooks.summarize:main"
waystone-hook-posttool = "waystone._hooks.posttool:main"
waystone-hook-import-memory = "waystone._hooks.import_memory:main"
waystone-hook-sessionstart = "waystone._hooks.sessionstart:main"
waystone-statusline = "waystone._hooks.statusline:main"

[tool.setuptools.packages.find]
include = ["waystone*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Intentional late imports (circular-import avoidance / conditional feature imports).
"waystone/api_server.py" = ["E402"]
"waystone/domain_profiles.py" = ["E402"]
