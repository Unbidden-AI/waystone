[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-broker"
version = "0.1.0"
description = "A context intelligence layer for LLM workflows"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
ctx = "context_broker.cli:cli"

[tool.setuptools.packages.find]
include = ["context_broker*"]
