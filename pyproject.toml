[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waystone"
version = "0.3.9"
description = "A context intelligence layer for LLM workflows"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "memory", "mcp", "llm", "agents", "context", "knowledge-graph"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "croniter>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "litellm>=1.40",
    "tiktoken>=0.7",
    "tomlkit>=0.12",
]

[project.urls]
Homepage = "https://unbidden.ai/waystone/"
Repository = "https://github.com/Unbidden-AI/waystone"
Documentation = "https://unbidden.ai/docs/"
"Bug Tracker" = "https://github.com/Unbidden-AI/waystone/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.22", "pyjwt[crypto]>=2.8"]
semantic = ["sqlite-vec", "sentence-transformers"]
monitoring = ["sentry-sdk[fastapi]>=2.0"]
openclaw = ["pyyaml>=6.0"]  # no extra deps beyond core; pyyaml already required

[project.scripts]
waystone = "waystone.cli:cli"
waystone-mcp = "waystone.mcp_server:run_server"
waystone-hook-submit = "waystone._hooks.submit:main"
waystone-hook-stop = "waystone._hooks.stop:main"

[tool.setuptools.packages.find]
include = ["waystone*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter
