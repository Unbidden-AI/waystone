[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "A context intelligence layer for LLM workflows"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "litellm>=1.40",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.22"]

[project.scripts]
engram = "engram.cli:cli"
engram-mcp = "engram.mcp_server:run_server"

[tool.setuptools.packages.find]
include = ["engram*", "orchestrator*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter
