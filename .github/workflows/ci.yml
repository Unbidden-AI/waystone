name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Lint is a separate job from tests (independent signals). The legacy ruff
  # backlog has been cleared — `ruff check waystone/ tests/` is GREEN, so any
  # lint failure here is a real, new finding. Keep it that way.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check waystone/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # Postgres + pgvector so the PostgresGraphStore (Team backend) tests actually run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: waystone
          POSTGRES_DB: waystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,team,api]"

      - name: Run tests
        env:
          WAYSTONE_TEST_PG_DSN: postgresql://postgres:waystone@localhost:5432/waystone_test
        run: pytest tests/ -v --tb=short

      - name: Smoke test CLI
        run: waystone --help

  # Windows coverage — historically UNTESTED in CI. Every Windows bug so far
  # (cp1252 console crashes, sqlite-vec cold-start) was found in production and
  # patched reactively. This job exercises the cross-platform-sensitive paths
  # (encoding, file I/O, path handling, sqlite-vec load) on a real Windows box.
  # No Postgres service: the team-backend tests skip without WAYSTONE_TEST_PG_DSN,
  # exactly as a Windows dev running the suite locally would see.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,team,api]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test CLI (UTF-8 glyph output on legacy console)
        run: waystone --help

  # Notify Discord the moment CI goes red, so a failure can't sit unnoticed and
  # turn "red" back into background noise. Dormant until a DISCORD_CI_WEBHOOK
  # repo secret is set (the step self-skips if it's absent).
  notify-failure:
    needs: [lint, test, test-windows]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No DISCORD_CI_WEBHOOK secret set — skipping notification."
            exit 0
          fi
          MSG="🔴 CI failed on \`${REF}\` (\`${SHA:0:7}\`) — ${RUN_URL}"
          jq -n --arg c "$MSG" '{content: $c}' | \
            curl -fsSL -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @-
