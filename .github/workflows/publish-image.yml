name: Publish Team Server image

# Builds the self-hosted Team Server container and pushes it to GHCR so buyers
# can `docker compose up` WITHOUT cloning the repo or building from source.
#
# Fires on the same v* tags as the PyPI release (one tag ships both), plus manual
# dispatch. Multi-arch (amd64 + arm64) so it runs on Intel/AMD servers and Apple
# Silicon alike.
#
# ONE-TIME setup (org owner): after the first run, make the package public —
#   github.com/orgs/Unbidden-AI/packages → waystone-server → Package settings →
#   Change visibility → Public. Otherwise `docker pull` needs auth.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/waystone-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          # lowercase the image ref (GHCR requires lowercase)
          IMG="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "list=${IMG}:${VER},${IMG}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=${IMG}:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Waystone self-hosted Team Server
