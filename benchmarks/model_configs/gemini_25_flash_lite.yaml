llm:
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  model: "gemini-2.5-flash-lite"
  temperature: 0.1
  max_tokens: 65536
  api_key_env: "GEMINI_API_KEY"
  timeout: 300.0
  reasoning_effort: "none"

defaults:
  top_k: 30

# Strategy overrides for Flash-Lite: disable semantic for default/filtered/tight
# to test impact of semantic search contamination on retrieval quality.
# See Issue #6: semantic search currently hurts Flash-Lite by -12pp (89% → 77%)
strategies:
  baseline:
    semantic: true
  default:
    semantic: false
  filtered:
    semantic: false
  tight:
    semantic: false
