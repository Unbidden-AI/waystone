llm:
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  model: "gemini-2.5-flash-lite"
  temperature: 0.1
  max_tokens: 65536
  api_key_env: "GEMINI_API_KEY"
  timeout: 300.0
  reasoning_effort: "none"

defaults:
  top_k: 30

# Per-strategy config support via Issue #6 flag infrastructure.
# Semantic enabled for all strategies — A/B results are contradictory across runs
# (Issue #5 found -12pp with semantic ON; Issue #6 Part 1 found -3pp with semantic OFF).
# Leaving semantic: true as default until calibration runner can settle this empirically.
strategies:
  baseline:
    semantic: true
  default:
    semantic: true
  filtered:
    semantic: true
  tight:
    semantic: true
