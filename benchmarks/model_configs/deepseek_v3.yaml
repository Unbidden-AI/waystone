llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.1
  # DeepSeek-V3 supports up to 8192 output tokens on the standard API.
  # If you hit finish_reason=length, try reducing chunk_size to 15000.
  max_tokens: 8192
  api_key_env: "DEEPSEEK_API_KEY"
  timeout: 180.0

defaults:
  top_k: 25
