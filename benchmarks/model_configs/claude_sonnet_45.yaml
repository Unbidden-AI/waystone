llm:
  # Anthropic's OpenAI-compatible endpoint works with the standard /chat/completions
  # path. Verify the exact model ID at: https://docs.anthropic.com/en/docs/models-overview
  # Common format: claude-sonnet-4-5 or claude-sonnet-4-5-YYYYMMDD
  base_url: "https://api.anthropic.com/v1"
  model: "claude-sonnet-4-5"
  temperature: 0.1
  max_tokens: 8192
  api_key_env: "ANTHROPIC_API_KEY"
  timeout: 180.0

defaults:
  top_k: 25
