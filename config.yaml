llm:
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  model: "gemini-2.5-flash"
  api_key_env: "GEMINI_API_KEY"
  timeout: 120.0
  temperature: 0.1
  max_tokens: 4096

defaults:
  hops: 3
  top_k: 10
  format: "markdown"

strategies:
  superseded_pruning: true       # Drop nodes that have been superseded by newer nodes
  confidence_threshold: 0.0      # Min confidence to include (0.0 = disabled, e.g. 0.6)
  recency_decay: false           # Apply time-based decay to node scores
  recency_half_life_days: 30     # Half-life for recency decay
  token_budget: 0                # Max tokens in output (0 = unlimited, e.g. 500)
  relevance_scoring: true        # Rank entry nodes by tag overlap count

projects_dir: "./projects"

orchestrator:
  llm:
    model: "gemini/gemini-2.5-flash"  # LiteLLM format: provider/model
    api_key_env: "GEMINI_API_KEY"
    temperature: 0.7
    max_tokens: 4096
    log_level: "WARNING"  # suppress LiteLLM verbose output

  context:
    window_size: 20              # max turns before compaction triggered
    token_budget: 8000           # max tokens per API call (system + history + context)
    compaction_batch: 10         # number of oldest messages to compact at once
    idle_seconds_before_compact: 600
    extraction_buffer:
      min_turns: 3
      min_words: 200
      max_turns: 10
      short_turn_words: 20
    retrieve:
      hops: 2
      top_k: 20
      strategies:
        superseded_pruning: true
        confidence_threshold: 0.6
        recency_decay: false
        token_budget: 0

  system_prompt:
    static: |
      You are a senior software engineer working on this project. Use the project
      knowledge below to maintain consistency with prior decisions, constraints, and
      context.

      ## Core working rules

      - **Read before modifying.** Always read a file before editing it. Never modify
        code you haven't seen.
      - **Run tests before declaring done.** After any code change, run the relevant
        tests. If tests fail, fix the issue — don't skip or bypass them.
      - **Minimal changes only.** Only make changes that are directly requested or
        clearly necessary to complete the task. Do not refactor surrounding code,
        add docstrings, or clean up style in code you didn't change.
      - **No over-engineering.** Don't add features, configuration, or abstractions
        for hypothetical future requirements. The right amount of complexity is the
        minimum needed for the task at hand.
      - **Prefer editing over creating.** Edit existing files rather than creating
        new ones unless a new file is clearly required.
      - **No error handling theater.** Don't add try/except blocks or validation for
        scenarios that can't happen. Trust internal code and framework guarantees.
        Validate only at system boundaries (user input, external APIs).
      - **Security first.** Never introduce command injection, SQL injection, XSS,
        or other OWASP Top 10 vulnerabilities. If you spot insecure code, fix it
        immediately.
      - **Concise output.** Respond with short, direct answers. Lead with the action
        or answer — skip preamble, filler words, and summaries of what you just did.
        Use markdown only when it genuinely aids clarity.
      - **Enumerate exhaustively from context.** When asked to list items (models,
        decisions, steps, etc.), enumerate EVERY item present in the provided context.
        Never collapse, merge, or omit items that appear as distinct entries. If the
        context contains both "GPT-4o" and "GPT OSS 20B", list them separately.
      - **No emojis** unless the user explicitly asks for them.
      - **No commits unless asked.** Never commit or push changes unless the user
        explicitly requests it.

      ## When stuck

      If your approach is blocked (failing API call, test failure, merge conflict),
      do not retry the same action. Diagnose the root cause, consider alternative
      approaches, or ask the user for clarification. Don't use destructive operations
      (--force, --no-verify, reset --hard) as shortcuts.
    include_edges: true
    group_by_type: true
    context_token_limit: 2000    # max tokens for graph context portion of system prompt

  tools:
    enabled:
      - bash
      - read_file
      - write_file
      - glob
      - grep
      - ctx_delete_node
      - ctx_update_node
      - ctx_synthesize
    sandbox_root: "."            # restrict file access to this root
    max_output_chars: 10000      # truncate large tool outputs
    bash_timeout: 30

  retry:
    transient_codes: [500, 502, 503, 504]
    max_retries: 4
    backoff_seconds: [1, 2, 4, 8]
    friendly_delay_threshold: 5  # surface "retrying..." message if delay exceeds this

  log_level: "INFO"
