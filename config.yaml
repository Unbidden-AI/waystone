llm:
  base_url: "http://localhost:1234/v1"
  model: "qwen3.5-35b-a3b"
  temperature: 0.1
  max_tokens: 4096

defaults:
  hops: 3
  top_k: 10
  format: "markdown"

strategies:
  superseded_pruning: true       # Drop nodes that have been superseded by newer nodes
  confidence_threshold: 0.0      # Min confidence to include (0.0 = disabled, e.g. 0.6)
  recency_decay: false           # Apply time-based decay to node scores
  recency_half_life_days: 30     # Half-life for recency decay
  token_budget: 0                # Max tokens in output (0 = unlimited, e.g. 500)
  relevance_scoring: true        # Rank entry nodes by tag overlap count

projects_dir: "./projects"
