[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Environment variables to set in the Railway dashboard (Settings → Variables):
#
#   CB_USE_ADMIN_DB=1
#   STRIPE_SECRET_KEY=<sk_live_... from Stripe dashboard API keys>
#   STRIPE_WEBHOOK_SECRET=<from Stripe webhook endpoint settings>
#   STRIPE_PRO_PRICE_ID=<Pro monthly price ID from Stripe dashboard>
#   STRIPE_PRO_ANNUAL_PRICE_ID=<Pro annual price ID>
#   STRIPE_TEAM_PRICE_ID=<Team monthly price ID>
#   STRIPE_TEAM_ANNUAL_PRICE_ID=<Team annual price ID>
#   SENTRY_DSN=<from Sentry project settings>
#
# Railway injects PORT automatically — do not set it manually.
