# Waystone Team Server — zero-clone deploy. Uses the PUBLISHED image (no build).
#
#   1. Download this file and the env template, side by side:
#        curl -O https://unbidden.ai/team-server/docker-compose.yml
#        curl -o .env https://unbidden.ai/team-server/env.example
#   2. Edit .env — paste your WAYSTONE_LICENSE + an LLM_API_KEY.
#   3. docker compose up -d        # pulls the image; no source, no build
#   4. docker compose exec server waystone team issue teammate@acme.com
#
#   curl localhost:8000/v1/health  # {"status":"ok",...}
#
# Pin a version with WAYSTONE_IMAGE=ghcr.io/unbidden-ai/waystone-server:0.4.37
# (defaults to :latest). Building from source instead? Use the repo's root
# docker-compose.yml, which has `build: .`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waystone}
      POSTGRES_DB: ${POSTGRES_DB:-waystone}
    volumes:
      - waystone-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waystone} -d ${POSTGRES_DB:-waystone}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    image: ${WAYSTONE_IMAGE:-ghcr.io/unbidden-ai/waystone-server:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WAYSTONE_STORE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-waystone}:${POSTGRES_PASSWORD:-waystone}@db:5432/${POSTGRES_DB:-waystone}
      # Auth: paste a license (per-seat, auto-on) OR set a shared WAYSTONE_API_KEY.
      WAYSTONE_LICENSE: ${WAYSTONE_LICENSE:-}
      WAYSTONE_API_KEY: ${WAYSTONE_API_KEY:-}
      CB_USE_ADMIN_DB: ${CB_USE_ADMIN_DB:-}
      CB_ADMIN_DB: /data/admin.db
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      PORT: 8000
    ports:
      - "${WAYSTONE_PORT:-8000}:8000"
    volumes:
      - waystone-serverdata:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  waystone-pgdata:
  waystone-serverdata:
